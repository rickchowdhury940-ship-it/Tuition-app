<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FeeTrack – Tuition Fee Manager</title>
<style>
:root{--b:#2563eb;--bd:#1d4ed8;--bl:#eff6ff;--t:#0f172a;--m:#64748b;--l:#e2e8f0;--g:#16a34a;--r:#dc2626}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--t);background:#fff}
h1{font-size:22px;margin:0}h3{margin:0 0 6px}
nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--l);display:flex;padding:4px 2px env(safe-area-inset-bottom)}
nav .brand{display:none}
nav button{flex:1;border:0;background:none;color:var(--m);display:flex;flex-direction:column;align-items:center;font:inherit;font-size:11px;padding:6px 0;border-radius:10px;cursor:pointer}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--b);font-weight:600}
main{padding:16px 14px 96px;max-width:1100px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sub{color:var(--m);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.card{border:1px solid var(--l);border-radius:16px;padding:16px;background:#fff;box-shadow:0 1px 3px rgba(37,99,235,.06)}
.stat b{display:block;font-size:26px;color:var(--b)}.stat span{color:var(--m);font-size:13px}
.stat.red b{color:var(--r)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--l)}
.item:last-child{border:0}
.btn{background:var(--b);color:#fff;border:1px solid var(--b);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--bd)}
.btn.s{background:#fff;color:var(--b)}.btn.s:hover{background:var(--bl)}
.btn.g{background:#16a34a;border-color:#16a34a}.btn.d{background:#fff;color:var(--r);border-color:#fecaca}
.btn.x{padding:5px 10px;font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.bg{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.Paid{background:#dcfce7;color:#166534}.Partial{background:#dbeafe;color:#1e40af}.Pending{background:#e2e8f0;color:#334155}.Overdue{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;color:var(--m);font-weight:600;padding:8px;border-bottom:2px solid var(--l)}
td{padding:10px 8px;border-bottom:1px solid var(--l);vertical-align:middle}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters>*{flex:1;min-width:130px}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;background:#fff;color:var(--t)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--b);outline-offset:1px}
.err{color:var(--r);font-size:13px;min-height:20px;margin-top:6px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.empty{text-align:center;color:var(--m);padding:28px 10px}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(15,23,42,.3)}
dialog::backdrop{background:rgba(15,23,42,.5)}
.in{padding:20px}
.rc td{border:0;padding:4px 0}.rc{text-align:center}.rc table{text-align:left;margin:10px 0}
.rc .big{font-size:24px;color:var(--b);font-weight:700}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw;text-align:center}
#toast.on{opacity:1}
.scroll{overflow-x:auto}
@media(min-width:900px){
 body{padding-left:230px}
 nav{top:0;bottom:auto;right:auto;width:230px;flex-direction:column;border-top:0;border-right:1px solid var(--l);padding:18px 12px;gap:4px}
 nav .brand{display:block;margin-bottom:18px;padding:0 8px}
 nav .brand b{font-size:20px;color:var(--b)}nav .brand small{display:block;color:var(--m)}
 nav button{flex:0 0 auto;flex-direction:row;gap:10px;font-size:15px;padding:11px 12px;width:100%}
 nav button.on{background:var(--bl)}
 main{padding:28px 28px 40px}#toast{bottom:24px}
}
@media(max-width:700px){
 .resp thead{display:none}
 .resp tr{display:block;border:1px solid var(--l);border-radius:14px;margin-bottom:10px;padding:6px}
 .resp td{display:flex;justify-content:space-between;gap:10px;border:0;padding:4px 8px;text-align:right}
 .resp td::before{content:attr(data-l);color:var(--m);text-align:left}
 .resp td.a{justify-content:flex-start;flex-wrap:wrap}.resp td.a::before{display:none}
}
body.out nav,body.out main{display:none}body.out{padding-left:0!important}
.auth{max-width:420px;margin:8vh auto}.auth h1{margin-bottom:4px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px}.bar select{width:auto;max-width:100%}
.note{background:var(--bl);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--bd);margin:10px 0}
.adm{display:none}body.isadmin nav .adm{display:flex}
@media(max-width:899px){nav button{font-size:10px}}
@media print{nav,main,#toast,.np{display:none!important}dialog{position:static;box-shadow:none;width:100%;max-width:none}dialog::backdrop{display:none}}
</style>
</head>
<body class="out">
<nav>
 <div class="brand"><b>₹ FeeTrack</b><small id="centre"></small></div>
 <button class="adm" data-p="teachers"><i>👥</i><span>Teachers</span></button>
 <button data-p="dashboard"><i>🏠</i><span>Dashboard</span></button>
 <button data-p="students"><i>🎓</i><span>Students</span></button>
 <button data-p="fees"><i>💰</i><span>Fees</span></button>
 <button data-p="reports"><i>📊</i><span>Reports</span></button>
 <button data-p="groups"><i>🗂️</i><span>Groups</span></button>
 <button data-p="settings"><i>⚙️</i><span>Settings</span></button>
</nav>
<main id="main"></main>
<div id="auth"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
/* ============ Helpers ============ */
const KEY='feetrack_v1';
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>iso(new Date());
const curM=()=>today().slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const mLabel=m=>new Date(m+'-01T00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const dLabel=d=>new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
/* Escape user text before it goes into innerHTML (prevents HTML injection) */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ Data layer ============ */
let db,store,sess=null;
const DEMO=[['Aarav Sharma','Rajesh Sharma','9876501234',1500,5],['Diya Patel','Meena Patel','9898012345',1800,10],['Rohan Iyer','Sunita Iyer','9845012345',2000,7],['Ananya Reddy','Venkat Reddy','9701234567',1500,10],['Kabir Singh','Harpreet Singh','9815098765',2200,5],['Isha Gupta','Anil Gupta','9810012345',1600,15],['Vihaan Nair','Lakshmi Nair','9447012345',1700,10],['Saanvi Joshi','Prakash Joshi','9822012345',1900,12]];
function makePay(d,o){o.id=uid();o.no=++d.seq;d.payments.push(o)}
/* Builds realistic demo data relative to today's date */
function demo(){
 const n=new Date(),back=k=>iso(new Date(n.getFullYear(),n.getMonth()-k,1)).slice(0,7);
 const d={settings:{centre:'Bright Minds Tuition Centre',teacher:'Priya Nair',defFee:1500,defDue:10},students:[],payments:[],seq:0,groups:[{id:uid(),name:'Morning Batch'},{id:uid(),name:'Evening Batch'}]};
 DEMO.forEach((x,i)=>{
  const k=3+i%3,s={id:uid(),name:x[0],parent:x[1],phone:x[2],fee:x[3],join:back(k)+'-'+p2(1+i*3%25),due:x[4],groupId:d.groups[i%2].id};
  d.students.push(s);
  for(let j=0;j<=k;j++){
   const m=back(k-j),cur=m===curM();
   const r=cur?i%3:((i*3+j)%7<4?0:(i*3+j)%7===4?1:2); // 0 full, 1 half, 2 none
   if(r===2)continue;
   const day=Math.min(28,Math.max(s.due,+s.join.slice(8)));
   makePay(d,{sid:s.id,month:m,amount:r?Math.round(s.fee/2):s.fee,method:['Cash','UPI','Bank Transfer'][(i+j)%3],date:cur?today():m+'-'+p2(day)});
  }
 });
 return d;
}
const KEY2='feetrack_v2';
/* Every teacher's data must have groups; students without one are put in "General" (existing data is kept) */
function fixAll(){Object.values(store.data).forEach(d=>{
 d.settings=d.settings||{centre:'My Tuition Centre',teacher:'',defFee:1500,defDue:10};d.groups=d.groups||[];d.payments=d.payments||[];d.students=d.students||[];d.seq=d.seq||0;
 d.students.forEach(s=>{if(!d.groups.some(g=>g.id===s.groupId)){let g=d.groups.find(x=>x.name==='General');if(!g){g={id:uid(),name:'General'};d.groups.push(g)}s.groupId=g.id}})})}
/* Loads the account store. Legacy single-user data (feetrack_v1) is copied, never deleted, into a first teacher account */
function load(){
 try{const r=localStorage.getItem(KEY2);if(r){const s=JSON.parse(r);if(s&&Array.isArray(s.teachers)&&s.data){store=s;fixAll();return}}}catch(e){}
 try{const raw=localStorage.getItem(KEY2);if(raw)localStorage.setItem(KEY2+'_backup',raw)}catch(e){}
 store={v:2,admin:null,teachers:[],data:{},seqT:1};
 let old=null;try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 const d=old&&Array.isArray(old.students)?old:demo(),id='t_'+uid();
 store.teachers.push({id,code:'T001',name:(d.settings&&d.settings.teacher)||'Teacher',username:'teacher1',active:true,salt:'',hash:''});
 store.data[id]=d;fixAll();save();
}
function save(){try{localStorage.setItem(KEY2,JSON.stringify(store))}catch(e){toast('Could not save – browser storage is unavailable')}}
const getS=id=>db.students.find(s=>s.id===id);

/* ============ Fee calculations ============ */
/* All fee months from the student's joining month up to the current month */
function monthsFor(s){const o=[];let [y,m]=s.join.slice(0,7).split('-').map(Number);const end=curM();
 while(y+'-'+p2(m)<=end){o.push(y+'-'+p2(m));if(++m>12){m=1;y++}}return o}
/* Fee record for one student+month: paid so far, balance, and status */
function rec(s,m){
 const paid=sum(db.payments.filter(x=>x.sid===s.id&&x.month===m),x=>x.amount);
 const bal=Math.max(0,Math.round((s.fee-paid)*100)/100),due=m+'-'+p2(s.due);
 return{m,paid,bal,due,st:bal===0?'Paid':today()>due?'Overdue':paid>0?'Partial':'Pending'};
}
const pendingOf=s=>monthsFor(s).map(m=>rec(s,m)).filter(r=>r.bal>0);
const badge=s=>`<span class="bg ${s}">${s}</span>`;

/* ============ UI helpers ============ */
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3500)}
function modal(h){const d=$('#dlg');d.innerHTML='<div class="in">'+h+'</div>';if(!d.open)d.showModal()}
const empty=t=>`<div class="empty">${t}</div>`;
const opts=(list,v)=>list.map(([a,b])=>`<option value="${esc(a)}"${a===v?' selected':''}>${esc(b)}</option>`).join('');
function csv(rows){return '\ufeff'+rows.map(r=>r.map(v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(',')).join('\r\n')}
async function dl(name,text,type){
 /* Published pages hand files to the viewer through the downloads capability; plain browsers use an anchor download */
 try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){try{await d.save({filename:name,data:text});toast('File ready')}catch(e){if(!e||e.code!=='declined')toast('Could not save the file here')}return}}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/csv'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
const waNum=p=>{const d=String(p).replace(/\D/g,'');return d.length===10?'91'+d:d};

/* ============ Pages ============ */
let page='dashboard';const st={q:'',fm:curM(),fs:'All',rs:'',g:''};
const pages={
dashboard(){
 const ms=curM(),coll=sum(db.payments.filter(x=>x.date.startsWith(ms)),x=>x.amount);
 let out=0,od=0;const pend=[];
 db.students.forEach(s=>{const r=pendingOf(s),t=sum(r,x=>x.bal);out+=t;od+=r.filter(x=>x.st==='Overdue').length;if(t>0)pend.push({s,t,r})});
 pend.sort((a,b)=>b.t-a.t);
 const rp=[...db.payments].sort((a,b)=>b.date.localeCompare(a.date)||b.no-a.no).slice(0,6);
 return `<div class="top"><div><h1>Dashboard</h1><div class="sub">${esc(db.settings.centre)} · ${esc(db.settings.teacher)}</div></div><button class="btn" data-a="pay">+ Record payment</button></div>
 <div class="grid">
 <div class="card stat"><b>${db.students.length}</b><span>Total students</span></div>
 <div class="card stat"><b>${inr(coll)}</b><span>Collected in ${mLabel(ms)}</span></div>
 <div class="card stat"><b>${inr(out)}</b><span>Total outstanding</span></div>
 <div class="card stat red"><b>${od}</b><span>Overdue payments</span></div></div>
 <div class="two"><div class="card"><h3>Recent payments</h3>${rp.length?rp.map(x=>{const s=getS(x.sid);return `<div class="item"><div><b>${esc(s?s.name:'Deleted student')}</b><div class="sub">${mLabel(x.month)} · ${esc(x.method)} · ${dLabel(x.date)}</div></div><b>${inr(x.amount)}</b></div>`}).join(''):empty('No payments yet. Record the first one.')}</div>
 <div class="card"><h3>Students with pending fees</h3>${pend.length?pend.map(({s,t,r})=>`<div class="item"><div><b>${esc(s.name)}</b><div class="sub">${r.length} month(s) · ${inr(t)} ${badge(r.some(x=>x.st==='Overdue')?'Overdue':r[0].st)}</div></div><div class="acts"><button class="btn x g" data-a="remind" data-id="${s.id}">Remind on WhatsApp</button><button class="btn x s" data-a="pay" data-id="${s.id}">Pay</button></div></div>`).join(''):empty('🎉 No pending fees.')}</div></div>`},
students(){return `<div class="top"><h1>Students</h1><button class="btn" data-a="addS">+ Add student</button></div>${noGroups()}
 <div class="filters"><input id="q" type="search" placeholder="Search by student, parent or phone" value="${esc(st.q)}">${groupSel()}</div><div class="card" id="list"></div>`},
fees(){return `<div class="top"><h1>Fees</h1><button class="btn" data-a="pay">+ Record payment</button></div>
 <div class="filters"><input id="fm" type="month" value="${esc(st.fm)}" placeholder="YYYY-MM"><select id="fs">${opts(['All','Paid','Partial','Pending','Overdue'].map(x=>[x,x==='All'?'All statuses':x]),st.fs)}</select><input id="q" type="search" placeholder="Search student" value="${esc(st.q)}">${groupSel()}</div>
 <div class="card"><div id="fsum" class="sub" style="margin-bottom:8px"></div><div id="list"></div></div>`},
reports(){
 const mm={};let to=0;
 db.students.filter(s=>!st.g||s.groupId===st.g).forEach(s=>monthsFor(s).forEach(m=>{const r=rec(s,m),o=mm[m]||(mm[m]={e:0,c:0,b:0,n:0,t:0});o.e+=s.fee;o.c+=r.paid;o.b+=r.bal;o.t++;if(!r.bal)o.n++;to+=r.bal}));
 const keys=Object.keys(mm).sort().reverse(),tc=sum(db.payments.filter(x=>inG(x.sid)),x=>x.amount);
 const pend=db.students.filter(s=>!st.g||s.groupId===st.g).map(s=>({s,r:pendingOf(s)})).filter(x=>x.r.length);
 const gl=db.students.filter(s=>!st.g||s.groupId===st.g),sel=gl.find(s=>s.id===st.rs)||gl[0],hist=sel?db.payments.filter(x=>x.sid===sel.id).sort((a,b)=>b.date.localeCompare(a.date)):[];
 return `<div class="top"><h1>Reports</h1><div class="acts"><button class="btn s" data-a="csvS">Export students CSV</button><button class="btn s" data-a="csvP">Export payments CSV</button></div></div>
 <div class="filters">${groupSel('gr')}</div><div class="grid"><div class="card stat"><b>${inr(tc)}</b><span>Total collected (all time)</span></div><div class="card stat red"><b>${inr(to)}</b><span>Total outstanding</span></div></div>
 ${groupReport()}<div class="card" style="margin-bottom:14px"><h3>Monthly collection summary</h3>${keys.length?`<div class="scroll"><table class="resp"><thead><tr><th>Month</th><th>Expected</th><th>Collected</th><th>Outstanding</th><th>Fully paid</th></tr></thead><tbody>${keys.map(k=>{const o=mm[k];return `<tr><td data-l="Month"><b>${mLabel(k)}</b></td><td data-l="Expected">${inr(o.e)}</td><td data-l="Collected">${inr(o.c)}</td><td data-l="Outstanding">${inr(o.b)}</td><td data-l="Fully paid">${o.n} / ${o.t}</td></tr>`}).join('')}</tbody></table></div>`:empty('Add students to see monthly summaries.')}</div>
 <div class="card" style="margin-bottom:14px"><h3>Pending fee report</h3>${pend.length?`<div class="scroll"><table class="resp"><thead><tr><th>Student</th><th>Parent</th><th>Pending months</th><th>Amount</th></tr></thead><tbody>${pend.map(({s,r})=>`<tr><td data-l="Student"><b>${esc(s.name)}</b></td><td data-l="Parent">${esc(s.parent)}</td><td data-l="Months">${r.map(x=>mLabel(x.m)).join(', ')}</td><td data-l="Amount"><b>${inr(sum(r,x=>x.bal))}</b></td></tr>`).join('')}</tbody></table></div>`:empty('No pending fees.')}</div>
 <div class="card"><h3>Student payment history</h3>${sel?`<select id="rs" style="margin:8px 0">${opts(gl.map(s=>[s.id,s.name]),sel.id)}</select>${hist.length?`<div class="scroll"><table class="resp"><thead><tr><th>Date</th><th>Fee month</th><th>Method</th><th>Amount</th><th></th></tr></thead><tbody>${hist.map(x=>`<tr><td data-l="Date">${dLabel(x.date)}</td><td data-l="Fee month">${mLabel(x.month)}</td><td data-l="Method">${esc(x.method)}</td><td data-l="Amount">${inr(x.amount)}</td><td class="a"><button class="btn x s" data-a="rcpt" data-id="${x.id}">Receipt</button></td></tr>`).join('')}</tbody></table></div>`:empty('No payments recorded for this student.')}`:empty('No students yet.')}</div>`},
settings(){const c=db.settings;return `<div class="top"><h1>Settings</h1></div>
 <div class="card" style="max-width:560px;margin-bottom:14px"><form id="cf"><label>Tuition centre name</label><input name="centre" maxlength="60" value="${esc(c.centre)}"><label>Teacher name</label><input name="teacher" maxlength="60" value="${esc(c.teacher)}"><label>Default monthly fee (₹)</label><input name="defFee" type="number" min="1" value="${esc(c.defFee)}"><label>Default due day of month (1–28)</label><input name="defDue" type="number" min="1" max="28" value="${esc(c.defDue)}"><div class="err" id="err"></div><button class="btn">Save settings</button></form></div>
 <div class="card" style="max-width:560px"><h3>Data</h3><p class="sub">Everything is stored only in this browser. Export a backup regularly.</p><div class="acts"><button class="btn s" data-a="backup">Export backup (JSON)</button><button class="btn d" data-a="clear">Clear all data</button></div></div>`}
};
/* Fill the students table (called on load and on every search keystroke) */
function fillStudents(){
 const q=st.q.toLowerCase(),l=db.students.filter(s=>(s.name+' '+s.parent+' '+s.phone).toLowerCase().includes(q)&&(!st.g||s.groupId===st.g));
 $('#list').innerHTML=l.length?`<div class="scroll"><table class="resp"><thead><tr><th>Student</th><th>Group</th><th>WhatsApp</th><th>Monthly fee</th><th>Joined</th><th>Due day</th><th>Pending</th><th></th></tr></thead><tbody>${l.map(s=>{const t=sum(pendingOf(s),x=>x.bal);return `<tr><td data-l="Student"><span><b>${esc(s.name)}</b><br><span class="sub">${esc(s.parent)}</span></span></td><td data-l="Group">${esc(gName(s.groupId))}</td><td data-l="WhatsApp">${esc(s.phone)}</td><td data-l="Monthly fee">${inr(s.fee)}</td><td data-l="Joined">${dLabel(s.join)}</td><td data-l="Due day">${s.due}</td><td data-l="Pending">${t?`<b style="color:var(--r)">${inr(t)}</b>`:badge('Paid')}</td><td class="a"><div class="acts"><button class="btn x s" data-a="edit" data-id="${s.id}">Edit</button><button class="btn x s" data-a="hist" data-id="${s.id}">History</button>${t?`<button class="btn x g" data-a="remind" data-id="${s.id}">Remind on WhatsApp</button>`:''}<button class="btn x d" data-a="del" data-id="${s.id}">Delete</button></div></td></tr>`}).join('')}</tbody></table></div>`:empty(db.students.length?'No students match your search.':'No students yet. Tap “Add student” to begin.');
}
/* Fill the monthly fee table for the selected month, status and search */
function fillFees(){

 if(!/^\d{4}-\d{2}$/.test(m)){$('#fsum').textContent='';$('#list').innerHTML=empty('Choose a valid month.');return}

/* Validates and saves a student (add or edit) */
function saveStudent(f){
 const v=Object.fromEntries(new FormData(f)),phone=v.phone.replace(/\D/g,''),fee=+v.fee,due=+v.due;
 const e=!v.name.trim()?'Enter the student name.':!v.parent.trim()?'Enter the parent name.':!db.groups.some(g=>g.id===v.groupId)?'Select a group – every student must belong to one.':!(/^\d{10}$/.test(phone)||/^\d{11,13}$/.test(phone))?'Enter a valid WhatsApp number (10 digits).':!(fee>0)?'Monthly fee must be more than 0.':!/^\d{4}-\d{2}-\d{2}$/.test(v.join)?'Choose a joining date.':!(due>=1&&due<=28&&Number.isInteger(due))?'Due day must be between 1 and 28.':'';

/* ============ Payments ============ */
/* Opens the record-payment form; optional student id and fee month pre-selected */
function payForm(sid,m){
 if(!db.students.length)return toast('Add a student first');
 const s0=getS(sid)||db.students[0];
 if(!m){const p=pendingOf(s0);m=p.length?p[0].m:curM()}
 modal(`<h3>Record payment</h3><form id="pf"><label>Student</label><select name="sid">${opts(db.students.map(s=>[s.id,s.name]),s0.id)}</select><label>Fee month</label><input name="month" type="month" value="${esc(m)}" max="${curM()}" placeholder="YYYY-MM"><div class="sub" id="bal" style="margin-top:6px"></div><label>Amount paid (₹)</label><input name="amount" type="number" min="1" step="any"><label>Payment method</label><select name="method"><option>Cash</option><option>UPI</option><option>Bank Transfer</option></select><label>Payment date</label><input name="date" type="date" value="${today()}" max="${today()}"><div class="err" id="err"></div><div class="row"><button type="button" class="btn s" data-a="close">Cancel</button><button class="btn">Save payment</button></div></form>`);

/* Shows fee, paid and balance for the chosen student/month; optionally fills the amount */
function updBal(fill){
 const f=$('#pf'),s=getS(f.sid.value),m=f.month.value;
 if(!s||!/^\d{4}-\d{2}$/.test(m)){$('#bal').textContent='';return}
 if(m<s.join.slice(0,7)){$('#bal').textContent='This month is before the student joined.';return}
 const r=rec(s,m);$('#bal').innerHTML=`Fee ${inr(s.fee)} · Paid ${inr(r.paid)} · <b>Balance ${inr(r.bal)}</b> ${badge(r.st)}`;
 if(fill)f.amount.value=r.bal||'';
}
/* Validates and saves a payment. Blocks fully-paid months, overpayment and exact duplicates */
function savePay(f){
 const v=Object.fromEntries(new FormData(f)),s=getS(v.sid),amt=+v.amount;
 let e='';
 if(!s)e='Choose a student.';
 else if(!/^\d{4}-\d{2}$/.test(v.month)||v.month>curM())e='Choose a fee month up to the current month.';
 else if(v.month<s.join.slice(0,7))e='Fee month is before the joining date.';
 else if(!v.date||v.date>today())e='Payment date cannot be in the future.';
 else if(!(amt>0))e='Enter an amount greater than 0.';
 else{
  const r=rec(s,v.month);
  if(r.bal===0)e=`${mLabel(v.month)} is already fully paid for ${s.name}. Duplicate entry blocked.`;
  else if(amt>r.bal)e=`Amount is more than the balance (${inr(r.bal)}).`;
  else if(db.payments.some(x=>x.sid===s.id&&x.month===v.month&&x.amount===amt&&x.date===v.date&&x.method===v.method))e='This exact payment is already recorded.';
 }
 if(e){$('#err').textContent=e;return}
 const p={sid:s.id,month:v.month,amount:amt,method:v.method,date:v.date};
 makePay(db,p);save();render();toast('Payment recorded');receipt(p.id);
}
/* Shows a printable receipt for one payment */
function receipt(pid){
 const x=db.payments.find(p=>p.id===pid),s=x&&getS(x.sid);if(!s)return;
 const r=rec(s,x.month),c=db.settings;
 modal(`<div class="rc"><h2 style="margin:0">${esc(c.centre)}</h2><div class="sub">Teacher: ${esc(c.teacher)}</div><h3 style="margin-top:14px">Fee receipt</h3><div class="big">${inr(x.amount)}</div>
 <table><tr><td>Receipt no.</td><td><b>FT-${String(x.no).padStart(4,'0')}</b></td></tr><tr><td>Date</td><td>${dLabel(x.date)}</td></tr><tr><td>Student</td><td>${esc(s.name)}</td></tr><tr><td>Parent</td><td>${esc(s.parent)}</td></tr><tr><td>Fee month</td><td>${mLabel(x.month)}</td></tr><tr><td>Method</td><td>${esc(x.method)}</td></tr><tr><td>Monthly fee</td><td>${inr(s.fee)}</td></tr><tr><td>Total paid for month</td><td>${inr(r.paid)}</td></tr><tr><td>Balance for month</td><td><b>${inr(r.bal)}</b></td></tr></table>
 <div class="sub">Thank you for your payment.</div><div class="row np"><button class="btn s" data-a="close">Close</button><button class="btn" data-a="print">Print receipt</button></div></div>`);
}

function history(id){
 const s=getS(id);if(!s)return;
 const pays=db.payments.filter(x=>x.sid===id).sort((a,b)=>b.date.localeCompare(a.date)),recs=monthsFor(s).map(m=>rec(s,m)).reverse();

 <h4 style="margin:14px 0 4px">Payments</h4>${pays.length?`<div class="scroll"><table><tr><th>Date</th><th>For</th><th>Method</th><th>Amount</th><th></th></tr>${pays.map(x=>`<tr><td>${dLabel(x.date)}</td><td>${mLabel(x.month)}</td><td>${esc(x.method)}</td><td>${inr(x.amount)}</td><td><button class="btn x s" data-a="rcpt" data-id="${x.id}">Receipt</button></td></tr>`).join('')}</table></div>`:empty('No payments yet.')}

/* ============ WhatsApp reminder ============ */
/* Builds a personalised message and opens WhatsApp (wa.me) with it pre-filled.
   Nothing is sent automatically – the parent's chat opens and the teacher must press Send. */
function remind(id){
 const s=getS(id),r=s?pendingOf(s):[];
 if(!s||!r.length)return toast('No pending fees for this student');
 const num=waNum(s.phone);if(!/^\d{10,15}$/.test(num))return toast('Invalid WhatsApp number – edit the student');
 const msg=`Hello ${s.parent}, this is a gentle reminder from ${db.settings.centre}. The tuition fee for ${s.name} is pending: ${inr(sum(r,x=>x.bal))} for ${r.map(x=>mLabel(x.m)).join(', ')}. Kindly pay at your earliest convenience. Thank you! – ${db.settings.teacher}`;
 window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank','noopener');
 toast('WhatsApp opened with a draft message. Review it and press Send there.');
}

/* ============ Accounts, groups & data isolation ============
   LOCAL DEMO ONLY: accounts and data live in this browser's localStorage. Passwords are salted + hashed
   (never stored as plain text), but client-side checks are NOT secure authentication or isolation.
   Real security needs a backend (Firebase Auth + Firestore security rules). */
const isAdmin=()=>!!sess&&sess.role==='admin';
const EMPTY=()=>({settings:{centre:'FeeTrack Admin',teacher:'Administrator',defFee:1500,defDue:10},students:[],payments:[],groups:[],seq:0});
const gName=id=>{const g=db.groups.find(x=>x.id===id);return g?g.name:''};
const inG=sid=>!st.g||(getS(sid)||{}).groupId===st.g;
const newSalt=()=>uid()+uid()+uid();
const groupSel=id=>`<select id="${id||'gs'}"><option value="">All groups</option>${opts(db.groups.map(g=>[g.id,g.name]),st.g)}</select>`;
const noGroups=()=>db.groups.length?'':'<div class="card" style="margin-bottom:14px"><b>Create a group to continue</b><div class="sub">You need at least one group before you can add students.</div><button class="btn x" data-a="addG" style="margin-top:8px">Create group</button></div>';
/* Runs fn with another teacher's data temporarily active (used for admin summaries only) */
function withDb(d,fn){const o=db;db=d;try{return fn()}finally{db=o}}

/* Salted PBKDF2 hash (Web Crypto). Weaker fallback if Web Crypto is unavailable. */
async function hash(pw,salt){
 const te=new TextEncoder();
 if(typeof crypto!=='undefined'&&crypto.subtle){
  const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode(salt),iterations:100000,hash:'SHA-256'},k,256);
  return 'p:'+[...new Uint8Array(b)].map(x=>p2(x.toString(16))).join('');
 }
 let a=0xdeadbeef,c=0x41c6ce57;
 for(let r=0;r<5000;r++)for(const ch of te.encode(salt+'|'+pw)){a=Math.imul(a^ch,2654435761);c=Math.imul(c^ch,1597334677)}
 return 'w:'+(a>>>0).toString(16)+(c>>>0).toString(16);
}

/* Runs before every render: pins `db` to the logged-in teacher's own data (or the admin's selected teacher) */
function guard(){
 if(isAdmin()){
  if(sess.view&&store.data[sess.view])db=store.data[sess.view];else{sess.view=null;db=EMPTY();page='teachers'}
 }else{
  const t=store.teachers.find(x=>x.id===sess.tid);
  if(!t||!t.active||!store.data[t.id]){logout();return false}
  db=store.data[t.id];if(page==='teachers')page='dashboard';
 }
 if(st.g&&!db.groups.some(g=>g.id===st.g))st.g='';
 return true;
}
function enter(role,tid){
 sess={role,tid,view:null};document.body.classList.remove('out');document.body.classList.toggle('isadmin',role==='admin');
 $('#auth').innerHTML='';page=role==='admin'?'teachers':'dashboard';st.q='';st.g='';st.rs='';st.fm=curM();st.fs='All';render();
}
function logout(){const d=$('#dlg');if(d.open)d.close();sess=null;db=EMPTY();document.body.classList.add('out');document.body.classList.remove('isadmin');showAuth()}
/* Login screen, or first-run admin setup when no admin exists yet */
function showAuth(msg){
 const setup=!store.admin;$('#main').innerHTML='';
 $('#auth').innerHTML=`<div class="auth card"><h1>₹ FeeTrack</h1><div class="sub">${setup?'First-time setup: create the admin account':'Log in to continue'}</div><div class="note">Local demo login: accounts and data are stored in this browser only. This is not secure production authentication.</div><form id="${setup?'setup':'lf'}">${setup?'':'<label>Log in as</label><select name="role"><option value="teacher">Teacher</option><option value="admin">Admin</option></select>'}<label>Username</label><input name="username" autocomplete="username" maxlength="30"><label>Password</label><input name="password" type="password" autocomplete="${setup?'new-password':'current-password'}">${setup?'<label>Confirm password</label><input name="confirm" type="password" autocomplete="new-password">':''}<div class="err" id="err">${esc(msg||'')}</div><button class="btn" style="width:100%">${setup?'Create admin account':'Log in'}</button></form></div>`;
}
async function doSetup(f){
 const v=Object.fromEntries(new FormData(f)),u=(v.username||'').trim().toLowerCase(),er=$('#err');
 if(!/^[a-z0-9_.-]{3,30}$/.test(u))return er.textContent='Username: 3–30 letters, numbers, . _ -';
 if((v.password||'').length<8)return er.textContent='Password must be at least 8 characters.';
 if(v.password!==v.confirm)return er.textContent='Passwords do not match.';
 if(store.teachers.some(t=>t.username===u))return er.textContent='That username belongs to a teacher account.';
 const salt=newSalt();store.admin={username:u,salt,hash:await hash(v.password,salt)};save();enter('admin',null);
 toast('Admin created. Open Teachers to set a password for the existing teacher account.');
}
async function doLogin(f){
 const v=Object.fromEntries(new FormData(f)),u=(v.username||'').trim().toLowerCase(),er=$('#err'),bad='Incorrect username or password.';
 const adm=v.role==='admin',a=adm?store.admin:store.teachers.find(t=>t.username===u);
 if(!a||(adm&&a.username!==u))return er.textContent=bad;
 if(!a.hash)return er.textContent='No password is set for this account. Ask the admin to set one.';
 if(a.active===false)return er.textContent='This account is deactivated. Contact the admin.';
 if(await hash(v.password||'',a.salt)!==a.hash)return er.textContent=bad;
 enter(v.role,adm?null:a.id);
}
/* Top bar: who is logged in, admin teacher-switcher, log out */
function bar(){
 const t=store.teachers.find(x=>x.id===(isAdmin()?sess.view:sess.tid));
 return `<div class="card bar"><div><b>${esc(isAdmin()?'Admin: '+store.admin.username:t.name)}</b><div class="sub">${isAdmin()?(t?'Viewing teacher: '+esc(t.name)+' ('+esc(t.code)+')':'Select a teacher to view their records'):'Teacher ID '+esc(t.code)}</div></div><div class="acts">${isAdmin()?`<select id="vs"><option value="">Switch teacher…</option>${opts(store.teachers.map(x=>[x.id,x.name+(x.active?'':' (inactive)')]),sess.view||'')}</select>`:''}<button class="btn x s" data-a="logout">Log out</button></div></div>`;
}
/* Admin switches to another teacher's data; any open form is closed so nothing carries over */
function setView(id){
 if(!isAdmin()||!store.data[id])return;const d=$('#dlg');if(d.open)d.close();
 sess.view=id;st.q='';st.g='';st.rs='';st.fm=curM();st.fs='All';if(page==='teachers')page='dashboard';render();
}

/* ---- Groups (always the active teacher's own) ---- */
function groupStats(id){const l=db.students.filter(s=>s.groupId===id);return{n:l.length,c:sum(db.payments.filter(x=>l.some(s=>s.id===x.sid)),x=>x.amount),p:sum(l,s=>sum(pendingOf(s),x=>x.bal))}}
function groupReport(){
 const gs=db.groups.filter(g=>!st.g||g.id===st.g);if(!gs.length)return '';
 return `<div class="card" style="margin-bottom:14px"><h3>Group-wise report</h3><div class="scroll"><table class="resp"><thead><tr><th>Group</th><th>Students</th><th>Collected</th><th>Pending</th></tr></thead><tbody>${gs.map(g=>{const k=groupStats(g.id);return `<tr><td data-l="Group"><b>${esc(g.name)}</b></td><td data-l="Students">${k.n}</td><td data-l="Collected">${inr(k.c)}</td><td data-l="Pending">${inr(k.p)}</td></tr>`}).join('')}</tbody></table></div></div>`;
}
pages.groups=()=>`<div class="top"><div><h1>Groups</h1><div class="sub">Batches, classes or sections. Every student must belong to a group.</div></div><button class="btn" data-a="addG">+ Add group</button></div>${noGroups()}${db.groups.length?`<div class="card"><div class="scroll"><table class="resp"><thead><tr><th>Group</th><th>Students</th><th>Collected</th><th>Pending</th><th></th></tr></thead><tbody>${db.groups.map(g=>{const k=groupStats(g.id);return `<tr><td data-l="Group"><b>${esc(g.name)}</b></td><td data-l="Students">${k.n}</td><td data-l="Collected">${inr(k.c)}</td><td data-l="Pending">${inr(k.p)}</td><td class="a"><div class="acts"><button class="btn x s" data-a="gStud" data-id="${g.id}">View students</button><button class="btn x s" data-a="editG" data-id="${g.id}">Rename</button><button class="btn x d" data-a="delG" data-id="${g.id}">Delete</button></div></td></tr>`}).join('')}</tbody></table></div></div>`:''}`;
function groupForm(id,then){
 const g=db.groups.find(x=>x.id===id);
 modal(`<h3>${g?'Rename':'Add'} group</h3>${then?'<div class="note">Create a group first – every student must belong to a group.</div>':''}<form id="gf" data-id="${esc(id||'')}" data-then="${then?1:''}"><label>Group name (e.g. Class 8 – Maths, Evening Batch)</label><input name="name" maxlength="40" value="${esc(g?g.name:'')}"><div class="err" id="err"></div><div class="row"><button type="button" class="btn s" data-a="close">Cancel</button><button class="btn">Save group</button></div></form>`);
}
/* Validates and saves a group; names are unique within one teacher's groups */
function saveGroup(f){
 const n=String(new FormData(f).get('name')||'').trim(),id=f.dataset.id,er=$('#err');
 if(!n)return er.textContent='Enter a group name.';
 if(db.groups.some(g=>g.id!==id&&g.name.toLowerCase()===n.toLowerCase()))return er.textContent='You already have a group with this name.';
 const g=db.groups.find(x=>x.id===id);if(g)g.name=n;else db.groups.push({id:uid(),name:n});
 save();$('#dlg').close();render();toast(g?'Group renamed':'Group created');if(f.dataset.then)studentForm();
}

/* ---- Admin: teacher management ---- */
pages.teachers=()=>{
 if(!isAdmin())return '';
 const rows=store.teachers.map(t=>({t,k:withDb(store.data[t.id],()=>({n:db.students.length,c:sum(db.payments,x=>x.amount),p:sum(db.students,s=>sum(pendingOf(s),x=>x.bal)),g:db.groups.map(g=>g.name+' ('+db.students.filter(s=>s.groupId===g.id).length+')').join(', ')}))}));
 const T=k=>sum(rows,r=>r.k[k]);
 return `<div class="top"><div><h1>Teachers</h1><div class="sub">Each teacher's records are stored separately. Use “View data” to open one teacher's app.</div></div><button class="btn" data-a="addT">+ Add teacher</button></div>
 <div class="grid"><div class="card stat"><b>${rows.length}</b><span>Teachers</span></div><div class="card stat"><b>${T('n')}</b><span>Total students</span></div><div class="card stat"><b>${inr(T('c'))}</b><span>Total collected</span></div><div class="card stat red"><b>${inr(T('p'))}</b><span>Total pending</span></div></div>
 <div class="card"><div class="scroll"><table class="resp"><thead><tr><th>Teacher</th><th>Status</th><th>Groups</th><th>Students</th><th>Collected</th><th>Pending</th><th></th></tr></thead><tbody>${rows.map(({t,k})=>`<tr><td data-l="Teacher"><span><b>${esc(t.name)}</b><br><span class="sub">${esc(t.code)} · ${esc(t.username)}${t.hash?'':' · password not set'}</span></span></td><td data-l="Status"><span class="bg ${t.active?'Paid':'Overdue'}">${t.active?'Active':'Inactive'}</span></td><td data-l="Groups">${esc(k.g)||'—'}</td><td data-l="Students">${k.n}</td><td data-l="Collected">${inr(k.c)}</td><td data-l="Pending">${inr(k.p)}</td><td class="a"><div class="acts"><button class="btn x" data-a="viewT" data-id="${t.id}">View data</button><button class="btn x s" data-a="editT" data-id="${t.id}">Edit</button><button class="btn x ${t.active?'d':'s'}" data-a="toggleT" data-id="${t.id}">${t.active?'Deactivate':'Activate'}</button></div></td></tr>`).join('')}</tbody></table></div></div>`;
};
function teacherForm(id){
 if(!isAdmin())return;const t=store.teachers.find(x=>x.id===id)||{name:'',username:'',active:true};
 modal(`<h3>${id?'Edit':'Add'} teacher</h3><form id="tf" data-id="${esc(id||'')}"><label>Teacher name</label><input name="name" maxlength="60" value="${esc(t.name)}"><label>Username (for login)</label><input name="username" maxlength="30" autocomplete="off" value="${esc(t.username)}"><label>${id?'New password (leave blank to keep current)':'Password (min 8 characters)'}</label><input name="password" type="password" autocomplete="new-password"><label>Status</label><select name="active"><option value="1"${t.active?' selected':''}>Active</option><option value="0"${t.active?'':' selected'}>Inactive</option></select><div class="err" id="err"></div><div class="row"><button type="button" class="btn s" data-a="close">Cancel</button><button class="btn">Save teacher</button></div></form>`);
}
/* Admin only: creates/updates a teacher account (unique ID, unique username, hashed password) with its own empty data store */
async function saveTeacher(f){
 if(!isAdmin())return;
 const v=Object.fromEntries(new FormData(f)),id=f.dataset.id,t=store.teachers.find(x=>x.id===id),u=(v.username||'').trim().toLowerCase(),pw=v.password||'';
 const e=!(v.name||'').trim()?'Enter the teacher name.':!/^[a-z0-9_.-]{3,30}$/.test(u)?'Username: 3–30 letters, numbers, . _ -':((store.admin&&store.admin.username===u)||store.teachers.some(x=>x.username===u&&x.id!==id))?'That username is already taken.':((!t||!t.hash)&&pw.length<8)?'Set a password of at least 8 characters.':(pw&&pw.length<8)?'Password must be at least 8 characters.':'';
 if(e){$('#err').textContent=e;return}
 let x=t;
 if(!x){x={id:'t_'+uid(),code:'T'+String(++store.seqT).padStart(3,'0')};store.teachers.push(x);store.data[x.id]={settings:{centre:'My Tuition Centre',teacher:v.name.trim(),defFee:1500,defDue:10},students:[],payments:[],groups:[],seq:0}}
 x.name=v.name.trim();x.username=u;x.active=v.active!=='0';
 if(pw){x.salt=newSalt();x.hash=await hash(pw,x.salt)}
 save();$('#dlg').close();render();toast(t?'Teacher updated':'Teacher added');
}

Object.assign(acts,{
 logout,addG:()=>groupForm(),editG:id=>groupForm(id),
 delG:id=>{const g=db.groups.find(x=>x.id===id);if(!g)return;if(db.students.some(s=>s.groupId===id))return toast('Move or delete this group’s students first');if(confirm(`Delete group “${g.name}”?`)){db.groups=db.groups.filter(x=>x.id!==id);save();render();toast('Group deleted')}},
 gStud:id=>{page='students';st.q='';st.g=id;render()},
 addT:()=>teacherForm(),editT:id=>teacherForm(id),viewT:id=>setView(id),
 toggleT:id=>{if(!isAdmin())return;const t=store.teachers.find(x=>x.id===id);if(!t)return;if(t.active&&!confirm(`Deactivate ${t.name}? They will not be able to log in.`))return;t.active=!t.active;save();render();toast(t.active?'Teacher activated':'Teacher deactivated')}
});

/* Start: load accounts, show the login (or first-run setup) screen */
function boot(){load();db=EMPTY();document.body.classList.add('out');showAuth()}

boot();
</script>
</body>
